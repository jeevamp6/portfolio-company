<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Aegrion Security</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandOrange: '#F48120',
            secondaryOrange: '#FFA640',
            lightOrange: '#FFBE5C',
            softOrange: '#FFF4EA',
            warmWhite: '#FFF8F2',
            textPrimary: '#111111',
            textSecondary: '#4B5563',
            borderColor: '#E9E9E9',
            footerNavy: '#17122A',
            success: '#10B981',
            danger: '#EF4444',
            warning: '#F59E0B'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Load Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .animate-spin {
      animation: spin 1s linear infinite;
    }
  </style>
</head>
<body class="bg-warmWhite min-h-screen flex items-center justify-center p-6 sm:p-12">
  <div class="w-full max-w-[440px] bg-white rounded-[20px] border border-borderColor p-8 shadow-[0_8px_32px_rgba(0,0,0,0.03)]">
    
    <div class="mb-8 text-center">
      <a href="index.html" class="inline-block mb-6">
        <img src="/logo.png" alt="Aegrion Security Logo" class="h-10 w-auto object-contain mx-auto">
      </a>
      <h2 class="text-2xl font-black text-textPrimary tracking-tight mb-2">Create New Password</h2>
      <p class="text-textSecondary font-medium text-sm">Please choose a secure password of at least 8 characters.</p>
    </div>

    <!-- Reset Form -->
    <form id="reset-form" class="space-y-5">
      <div class="flex flex-col gap-1.5">
        <label for="reset-pwd" class="text-xs font-bold text-textSecondary uppercase tracking-wider">New Password</label>
        <input type="password" id="reset-pwd" required class="w-full px-4 py-3 rounded-xl border border-borderColor focus:outline-none focus:border-brandOrange text-textPrimary font-medium text-sm transition-all duration-200" placeholder="••••••••">
      </div>
      
      <div class="flex flex-col gap-1.5">
        <label for="reset-confirm-pwd" class="text-xs font-bold text-textSecondary uppercase tracking-wider">Confirm New Password</label>
        <input type="password" id="reset-confirm-pwd" required class="w-full px-4 py-3 rounded-xl border border-borderColor focus:outline-none focus:border-brandOrange text-textPrimary font-medium text-sm transition-all duration-200" placeholder="••••••••">
      </div>

      <button type="submit" class="w-full py-3.5 rounded-full text-white bg-brandOrange hover:bg-brandOrange/95 font-semibold text-sm transition-all duration-200 shadow-sm text-center">
        Update Password
      </button>

      <div class="text-center mt-4">
        <a href="login.html" class="login-link text-xs font-bold text-brandOrange hover:underline">
          Cancel and login
        </a>
      </div>
    </form>

  </div>

  <script type="module">
    import { supabase, showNotification, LOGIN_URL } from './supabase-client.js';

    // Initialize icons
    lucide.createIcons();

    // Bind Back to Login links
    document.querySelectorAll('.login-link').forEach(el => {
      el.setAttribute('href', LOGIN_URL);
    });

    // Verify recovery session exists
    window.addEventListener('load', async () => {
      const { data: { session } } = await supabase.auth.getSession();
      
      // If no active recovery session is set, block the reset password action
      if (!session) {
        showNotification("Security error: Reset session expired or invalid. Please request a new link.", "error");
        setTimeout(() => {
          let redirectUrl = 'forgot-password.html';
          if (LOGIN_URL.startsWith('http')) {
            const urlObj = new URL(LOGIN_URL);
            urlObj.pathname = urlObj.pathname.endsWith('/') 
              ? urlObj.pathname + 'forgot-password.html' 
              : urlObj.pathname.substring(0, urlObj.pathname.lastIndexOf('/')) + '/forgot-password.html';
            redirectUrl = urlObj.toString();
          }
          window.location.href = redirectUrl;
        }, 3000);
      }
    });

    // Form logic
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const pwd = document.getElementById('reset-pwd').value;
      const confirmPwd = document.getElementById('reset-confirm-pwd').value;
      
      const resetBtn = e.target.querySelector('button[type="submit"]');
      const originalText = resetBtn.innerHTML;

      if (pwd !== confirmPwd) {
        showNotification("Passwords do not match!", "error");
        return;
      }

      if (pwd.length < 8) {
        showNotification("Password must be at least 8 characters long.", "warning");
        return;
      }
      
      // Enable loading state
      resetBtn.disabled = true;
      resetBtn.innerHTML = '<span class="flex items-center justify-center gap-2"><i data-lucide="loader" class="w-4 h-4 animate-spin text-white"></i> Updating Password...</span>';
      lucide.createIcons();

      try {
        // Update password using active session
        const { error } = await supabase.auth.updateUser({
          password: pwd
        });

        if (error) {
          showNotification(error.message, "error");
          resetBtn.disabled = false;
          resetBtn.innerHTML = originalText;
          lucide.createIcons();
          return;
        }

        showNotification("Password updated successfully! Redirecting to login...", "success");
        
        // Log user out to clear recovery token session
        await supabase.auth.signOut();

        setTimeout(() => {
          window.location.href = LOGIN_URL;
        }, 1500);

      } catch (err) {
        showNotification("Reset password operation failed. Try again.", "error");
        console.error(err);
        resetBtn.disabled = false;
        resetBtn.innerHTML = originalText;
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>

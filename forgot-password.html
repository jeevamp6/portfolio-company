<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Aegrion Security</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandOrange: '#F48120',
            secondaryOrange: '#FFA640',
            lightOrange: '#FFBE5C',
            softOrange: '#FFF4EA',
            warmWhite: '#FFF8F2',
            textPrimary: '#111111',
            textSecondary: '#4B5563',
            borderColor: '#E9E9E9',
            footerNavy: '#17122A',
            success: '#10B981',
            danger: '#EF4444',
            warning: '#F59E0B'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Load Supabase JS SDK & Cloudflare Turnstile -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .animate-spin {
      animation: spin 1s linear infinite;
    }
  </style>
</head>
<body class="bg-warmWhite min-h-screen flex items-center justify-center p-6 sm:p-12">
  <div class="w-full max-w-[440px] bg-white rounded-[20px] border border-borderColor p-8 shadow-[0_8px_32px_rgba(0,0,0,0.03)]">
    
    <div class="mb-8 text-center">
      <a href="index.html" class="inline-block mb-6">
        <img src="/logo.png" alt="Aegrion Security Logo" class="h-10 w-auto object-contain mx-auto">
      </a>
      <h2 class="text-2xl font-black text-textPrimary tracking-tight mb-2">Reset Your Password</h2>
      <p class="text-textSecondary font-medium text-sm">Enter your work email address and we will send you instructions to reset your password.</p>
    </div>

    <!-- Success message box -->
    <div id="reset-success" class="hidden flex-col items-center justify-center text-center py-6 gap-3">
      <i data-lucide="check-circle" class="text-success w-12 h-12"></i>
      <h3 class="text-lg font-bold text-textPrimary">Instructions Sent!</h3>
      <p class="text-textSecondary text-xs max-w-xs font-semibold leading-relaxed">
        We have sent a branded password reset link to your email. Please check your inbox and follow the link to reset your credentials.
      </p>
      <a href="login.html" class="login-link mt-4 px-6 py-2.5 bg-brandOrange text-white text-xs font-semibold rounded-full hover:bg-brandOrange/95 transition-all">Back to Login</a>
    </div>

    <!-- Reset Form -->
    <form id="forgot-form" class="space-y-5">
      <div class="flex flex-col gap-1.5">
        <label for="reset-email" class="text-xs font-bold text-textSecondary uppercase tracking-wider">Work Email</label>
        <input type="email" id="reset-email" required class="w-full px-4 py-3 rounded-xl border border-borderColor focus:outline-none focus:border-brandOrange text-textPrimary font-medium text-sm transition-all duration-200" placeholder="name@company.com">
      </div>

      <!-- Cloudflare Turnstile Verification -->
      <div class="my-2 flex justify-center w-full">
        <div id="turnstile-forgot-container" class="min-h-[65px] flex items-center justify-center"></div>
      </div>

      <button type="submit" class="w-full py-3.5 rounded-full text-white bg-brandOrange hover:bg-brandOrange/95 font-semibold text-sm transition-all duration-200 shadow-sm text-center">
        Send Reset Link
      </button>

      <div class="text-center mt-4">
        <a href="login.html" class="login-link text-xs font-bold text-brandOrange hover:underline inline-flex items-center gap-1">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back to Login
        </a>
      </div>
    </form>

  </div>

  <script type="module">
    import { supabase, showNotification, renderTurnstileWidget, LOGIN_URL } from './supabase-client.js';

    let turnstileToken = null;
    let turnstileWidgetId = null;

    async function initTurnstile() {
      const container = document.getElementById('turnstile-forgot-container');
      if (!container) return;
      turnstileWidgetId = await renderTurnstileWidget(container, {
        action: 'forgot-password',
        onSuccess: (token) => { turnstileToken = token; },
        onError: () => {
          turnstileToken = null;
          showNotification('Security verification failed. Please try again.', 'error');
        },
        onExpire: () => {
          turnstileToken = null;
          showNotification('Security verification expired. Please try again.', 'warning');
        }
      });
    }
    function resetTurnstile() {
      if (window.turnstile && turnstileWidgetId !== null) {
        try { window.turnstile.reset(turnstileWidgetId); } catch (_) {}
      }
      turnstileToken = null;
    }
    window.addEventListener('load', () => { initTurnstile(); });

    // Initialize icons
    lucide.createIcons();

    // Bind Back to Login links
    document.querySelectorAll('.login-link').forEach(el => {
      el.setAttribute('href', LOGIN_URL);
    });

    // Form logic
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('reset-email').value;
      const resetBtn = e.target.querySelector('button[type="submit"]');
      const originalText = resetBtn.innerHTML;

      // Cloudflare Turnstile Security Verification Check
      if (!turnstileToken) {
        showNotification('Please complete the security verification.', 'warning');
        return;
      }

      // Enable loading state
      resetBtn.disabled = true;
      resetBtn.innerHTML = '<span class="flex items-center justify-center gap-2"><i data-lucide="loader" class="w-4 h-4 animate-spin text-white"></i> Sending Link...</span>';
      lucide.createIcons();

      try {
        let redirectUrl = `${window.location.origin}/reset-password.html`;
        if (LOGIN_URL.startsWith('http')) {
          const urlObj = new URL(LOGIN_URL);
          urlObj.pathname = urlObj.pathname.endsWith('/') 
            ? urlObj.pathname + 'reset-password.html' 
            : urlObj.pathname.substring(0, urlObj.pathname.lastIndexOf('/')) + '/reset-password.html';
          redirectUrl = urlObj.toString();
        }

        // Perform Supabase Password Reset request with captchaToken
        const { data, error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: redirectUrl,
          captchaToken: turnstileToken
        });

        if (error) {
          showNotification(error.message, "error");
          resetTurnstile();
          resetBtn.disabled = false;
          resetBtn.innerHTML = originalText;
          lucide.createIcons();
          return;
        }
        
        // Toggle views on success
        document.getElementById('forgot-form').classList.add('hidden');
        document.getElementById('reset-success').classList.remove('hidden');
        document.getElementById('reset-success').classList.add('flex');
        
        showNotification("Reset instructions sent to your email.", "success");
        lucide.createIcons();

      } catch (err) {
        showNotification("Failed to send reset link. Try again later.", "error");
        console.error(err);
        resetTurnstile();
        resetBtn.disabled = false;
        resetBtn.innerHTML = originalText;
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
